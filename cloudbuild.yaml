# Cloud Build → Cloud Run デプロイ（H1-2）
# 実行: プロジェクトルートで gcloud builds submit --config=cloudbuild.yaml .
# Supabase: --substitutions=_VITE_SUPABASE_URL=xxx,_VITE_SUPABASE_ANON_KEY=yyy
# Vertex AI デモ: 上記に _VITE_VERTEX_AI_FUNCTION_URL=https://... を追加

substitutions:
  _REGION: asia-northeast1
  _SERVICE_NAME: campusclub-dashboard
  _VITE_SUPABASE_URL: ''
  _VITE_SUPABASE_ANON_KEY: ''
  _VITE_VERTEX_AI_FUNCTION_URL: ''

steps:
  # 1. Docker イメージをビルド（Supabase / Vertex AI をビルド時に埋め込む）
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${BUILD_ID}
      - --build-arg
      - VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg
      - VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}
      - --build-arg
      - VITE_VERTEX_AI_FUNCTION_URL=${_VITE_VERTEX_AI_FUNCTION_URL}
      - .
    id: build

  # 2. Container Registry にプッシュ
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${BUILD_ID}
    id: push
    waitFor: ['build']

  # 3. Cloud Run にデプロイ
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${BUILD_ID}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
    id: deploy
    waitFor: ['push']

  # 4. 未認証呼び出しを許可（Cloud Build の SA に権限がない場合は失敗するが、デプロイは完了している）
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - add-iam-policy-binding
      - ${_SERVICE_NAME}
      - --region=${_REGION}
      - --member=allUsers
      - --role=roles/run.invoker
      - --quiet
    id: allow-unauthenticated
    waitFor: ['deploy']
    # IAM 権限がない場合はこのステップが失敗する。403 のときは DEPLOY_CLOUD_RUN.md の手順で手動実行

options:
  logging: CLOUD_LOGGING_ONLY
