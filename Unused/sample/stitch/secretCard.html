<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cosmic Discovery Reveal - Variant 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<style>@keyframes twinkle {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 30px 10px rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 50px 20px rgba(139, 92, 246, 0.7); }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rays-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .bg-nebula {
            background: 
                radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(76, 29, 149, 0.8) 0%, #0f172a 100%),
                url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay, overlay, normal, normal;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }
        .card-container {
            perspective: 1000px;
        }
        .mystical-card {
            background: linear-gradient(135deg, #4c1d95 0%, #2e1065 100%);
            position: relative;
            overflow: hidden;
            animation: float 6s ease-in-out infinite, pulse-glow 3s infinite;
        }
        .mystical-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239C92AC' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .runes-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140%;
            height: 140%;
            transform: translate(-50%, -50%);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: spin-slow 20s linear infinite;
        }
        .light-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(139,92,246,0.8) 40%, transparent 70%);
            filter: blur(20px);
            animation: pulse-glow 1s infinite alternate;
        }
        .ray {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200vw;
            height: 20px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            transform-origin: left center;
        }
    </style>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#7C3AED", // Violet-600
                        "background-light": "#f3f4f6",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        display: ["'M PLUS Rounded 1c'", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen relative overflow-hidden text-white bg-nebula">
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            for(let i=0; i<50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDelay = Math.random() * 3 + 's';
                body.appendChild(star);
            }
        });
    </script>
<nav class="fixed top-0 w-full z-50 bg-white/10 dark:bg-black/20 backdrop-blur-md border-b border-white/10">
<div class="max-w-4xl mx-auto px-4">
<div class="flex items-center justify-center space-x-2 md:space-x-8 h-16 md:h-20">
<a class="flex flex-col items-center justify-center p-2 text-white/80 hover:text-white hover:bg-white/10 rounded-xl transition-all group" href="#">
<span class="material-icons-round text-3xl mb-1 text-orange-400 group-hover:scale-110 transition-transform">cottage</span>
<span class="text-xs font-bold tracking-wide">ホーム</span>
</a>
<a class="relative flex flex-col items-center justify-center p-2 px-6 bg-primary text-white rounded-2xl shadow-lg shadow-primary/40 transform scale-110 transition-all" href="#">
<div class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-primary animate-bounce">1</div>
<span class="material-icons-round text-3xl mb-1">local_activity</span>
<span class="text-xs font-bold tracking-wide">ガチャ</span>
</a>
<a class="flex flex-col items-center justify-center p-2 text-white/80 hover:text-white hover:bg-white/10 rounded-xl transition-all group" href="#">
<span class="material-icons-round text-3xl mb-1 text-green-400 group-hover:scale-110 transition-transform">style</span>
<span class="text-xs font-bold tracking-wide">マイデッキ</span>
</a>
<a class="flex flex-col items-center justify-center p-2 text-white/80 hover:text-white hover:bg-white/10 rounded-xl transition-all group" href="#">
<span class="material-icons-round text-3xl mb-1 text-purple-400 group-hover:scale-110 transition-transform">sports_esports</span>
<span class="text-xs font-bold tracking-wide">あそび</span>
</a>
</div>
</div>
</nav>
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen w-full pt-16">
<div class="absolute inset-0 overflow-hidden pointer-events-none z-0 opacity-30">
<div class="absolute top-1/2 left-1/2 w-[200vw] h-[200vw] -translate-x-1/2 -translate-y-1/2 animate-[spin-slow_60s_linear_infinite]">
<div class="absolute inset-0 bg-[conic-gradient(from_0deg,transparent_0deg,rgba(255,255,255,0.1)_15deg,transparent_30deg,rgba(255,255,255,0.1)_45deg,transparent_60deg)]"></div>
</div>
</div>
<div class="card-container relative w-64 h-96 md:w-80 md:h-[28rem] z-20 cursor-pointer group">
<div class="absolute -inset-4 bg-gradient-to-tr from-pink-500 via-purple-600 to-blue-600 rounded-3xl opacity-60 blur-2xl group-hover:opacity-80 transition duration-500 animate-pulse"></div>
<div class="mystical-card w-full h-full rounded-2xl border-2 border-white/20 shadow-2xl flex items-center justify-center relative backdrop-blur-sm">
<div class="runes-ring border-dashed border-white/30"></div>
<div class="runes-ring border-dotted border-pink-400/30 w-[120%] h-[120%] animation-delay-2000" style="animation-direction: reverse;"></div>
<div class="light-core"></div>
<div class="absolute inset-0 overflow-hidden rounded-2xl">
<div class="absolute top-1/4 left-1/4 w-2 h-2 bg-white rounded-full animate-ping opacity-75"></div>
<div class="absolute bottom-1/3 right-1/4 w-1 h-1 bg-pink-400 rounded-full animate-ping delay-75 opacity-75"></div>
<div class="absolute top-2/3 left-1/2 w-1.5 h-1.5 bg-blue-300 rounded-full animate-ping delay-150 opacity-75"></div>
</div>
<div class="relative z-10 text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.8)]">
<span class="material-icons-round text-8xl md:text-9xl animate-bounce">question_mark</span>
</div>
<div class="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none rounded-2xl"></div>
</div>
<div class="absolute -top-10 -left-10 text-yellow-300 animate-bounce delay-100 text-2xl">✨</div>
<div class="absolute top-1/2 -right-12 text-blue-300 animate-pulse delay-300 text-xl">✦</div>
<div class="absolute -bottom-8 left-1/2 text-pink-300 animate-bounce delay-700 text-2xl">★</div>
</div>
<div class="relative z-20 mt-12 text-center">
<h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-white to-blue-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)] tracking-wider animate-pulse">
                なにがでるかな？
            </h1>
<p class="text-white/70 mt-2 text-sm md:text-base font-bold tracking-widest uppercase">
                Tap to Reveal
            </p>
</div>
</main>
<div class="fixed bottom-8 w-full z-30 flex justify-center">
<button class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-3 px-8 rounded-full shadow-lg shadow-purple-900/50 transform hover:scale-105 transition-all border border-white/20 backdrop-blur-sm flex items-center space-x-2">
<span class="material-icons-round animate-spin">autorenew</span>
<span>スキップ</span>
</button>
</div>

</body></html>
